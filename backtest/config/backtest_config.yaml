# Backtest config. Read-only inputs from the main project; every output goes to backtest/workspace|outputs.
# Gates below are PRE-REGISTERED: their fingerprint is written to the run manifest before any valid/test
# data is opened. Do not tune them after looking at valid results; start a new version instead.
version: backtest-v1
reference_config: config/reference_baseline.yaml   # read-only, never overridden on disk

paths:
  workspace: backtest/workspace
  outputs: backtest/outputs
  # Hashed before/after each run to prove the backtest never touches project code/config/splits.
  protected: [src, tools, config, metadata, tests]

real:
  run_id: real-20261023-v1
  checkpoint: checkpoint-01
  # Repo-relative; mirrored 1:1 under storage.s3_root. Used in place if present locally, otherwise
  # pulled (--pull) into backtest/workspace/real/<same path>.
  train_bundle: data/daily/reference-v1/{run_id}/checkpoints/{checkpoint}/train
  valid_bundle: data/daily/reference-v1/{run_id}/checkpoints/{checkpoint}/valid
  baseline: data/models/reference-v1/{run_id}/checkpoints/{checkpoint}/baseline.json
  test_plan: reports/reference_baseline/{run_id}/test_plan_NOT_EXECUTED.json
  test_bundle: null          # no test features exist yet -> test track reports blocked_no_test_features
  # The baseline that was sent. Real mode refuses to read any baseline file with another SHA256.
  approved_baseline_sha256: cb844f813f2adadb4fcb84dee4beaeaf60dd7ec3b79fe2df02ffc7226da760de
  report_dir: reports/reference_baseline/{run_id}/checkpoints/{checkpoint}
  official_reports: [analysis_VALIDATION_REAL.json, validation_report.json, valid_exclusions.json]
  fit_report: data/models/reference-v1/{run_id}/checkpoints/{checkpoint}/fit_report.json

synthetic:
  seed: 20261024
  participants: {train: 8, valid: 4, test: 4}
  days: 10
  clock_hours: [9, 21]
  planted_shift:             # known answer: ENMO of chosen valid subjects += sd_units * fitted own-cohort scale
    metric: enmo_hourly_median_mean_g
    sd_units: 3.0
    subjects_per_cohort: 1
  missing_day: 4             # valid subjects have no hourly rows on this day -> previous_day_missing next day
  no_walking_day: 6          # one valid subject per cohort has zero walking windows this day
  nhanes_tremor_zero: true   # all NHANES tremor counts 0 -> zero_scale reference for that metric
  nhanes_train_walking_days: 1   # NHANES train walk only on day 0 -> insufficient cadence reference (null distances)

evaluability:
  min_valid_subjects_for_distribution: 3   # below this, valid summaries are descriptive only

stability:
  seed: 20261024
  n_bootstrap: 200
  sensitivity_min_participants: [3, 4, 5]  # sensitivity_only_not_production; config on disk unchanged

walkforward:
  splits: [train, valid]

metric_signal_type:          # device-confound diagnostic: amplitude metrics are the most brand-sensitive
  enmo_hourly_median_mean_g: amplitude
  walking_cadence_hourly_median_mean_hz: frequency
  rest_tremor_window_fraction: threshold_classification

gates:
  jackknife_median_shift_max_scale: 0.5     # max |median(without j) - median| / scale, per evaluable cell
  bootstrap_median_ci_width_max_scale: 2.0  # 95% subject-bootstrap CI width of median / scale
  no_lookahead_mismatches_max: 0
  baseline_unchanged: true
  protected_paths_unchanged: true
  known_answer_tolerance_sd: 0.75           # synthetic only
  device_flag_ratio: 2.0                    # amplitude gap >= ratio * max(other gaps) -> flag (not a fail)

test:
  allow_test_split: false    # second lock: must be true AND --unlock-test AND the approved baseline SHA256

symptom:                     # Track B, COPS only: hourly TremorScore 0 vs 1/2 (exploratory, not the baseline target)
  features_glob: data/features/cops/*.csv
  labels_path: null          # e.g. reports/model_readiness/<snapshot>/diary_labels_REVIEW_ONLY.csv
  label_column: tremor_score
  positive_scores: [1, 2]
  candidate_column: candidate_tremor
  n_folds: 5
  l2: 1.0
  seed: 20261024
  n_bootstrap: 200
  min_valid_subjects: 3
  drop_amplitude: false
  # Never model inputs (CLAUDE.md / README_feature.md section 5) + window counts.
  exclude_columns: [subject_id, dataset, label, split, day, hour, hour_idx, n_windows, valid_min,
                    n_walk, n_clean_walk, n_rest, n_tremor, tremor_score, kinesia_score, candidate,
                    candidate_tremor, duplicate_hour, remote_clean_pair, target]
