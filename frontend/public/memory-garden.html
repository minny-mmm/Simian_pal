<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memory Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e9fc;--out:#e0d3f4;--card:#fff;--pri:#8a6fd8;--pri2:#5f46ad;--pink:#f46f80;--ink:#2b2540;--mut:#6d6685;--ok:#2a8f64;--line:#e4dcf3;--bar:#e9e2f6;--imp:#ffe9ec;--note:#fff3cf;--frame:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f36;--out:#16121f;--card:#322b4a;--ink:#f3eefc;--mut:#b5acd0;--line:#463d66;--bar:#463d66;--imp:#4a2a37;--note:#4a4224;--frame:#3a3158;--pri2:#b9a6f5}}
:root[data-theme="dark"]{--bg:#241f36;--out:#16121f;--card:#322b4a;--ink:#f3eefc;--mut:#b5acd0;--line:#463d66;--bar:#463d66;--imp:#4a2a37;--note:#4a4224;--frame:#3a3158;--pri2:#b9a6f5}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
body{font:17px/1.55 "Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;color:var(--ink);background:var(--out);display:flex;align-items:center;justify-content:center;padding:10px}
#phone{width:100%;max-width:390px;height:min(820px,calc(100% - 4px));background:var(--bg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px #5f46ad40;border:6px solid var(--frame)}
#view{flex:1;overflow:auto;padding:18px 18px 28px}
@media(max-width:430px){body{padding:0}#phone{border:0;border-radius:0;height:100%}}
h1{font-size:46px;line-height:1.05;font-weight:800;margin:14px 0 8px}h2{font-size:22px;font-weight:800}h3{font-size:19px;font-weight:700}
.sm{font-size:15px;color:var(--mut)}.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.big{font-size:34px;font-weight:800}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:27px;background:var(--pri);color:#fff;font-weight:700;font-size:19px;margin:12px 0}.btn:disabled{opacity:.6}
.btn.red{background:var(--pink)}.btn{box-shadow:0 3px 0 #5f46ad44}.btn.ghost{box-shadow:none}.tile{border:2px dashed #fff9}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.lnk{border:0;background:none;color:var(--pri2);font-weight:700;text-decoration:underline;padding:8px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0}
.blob{--s:64px;position:relative;width:var(--s);height:calc(var(--s)*.86);background:var(--c);border-radius:50% 50% 44% 44%;flex:none}
.blob .e{position:absolute;top:40%;width:17%;height:21%;border-radius:50%;background:#241c3a}.blob .e:first-child{left:25%}.blob .e:last-child{right:25%}
.bl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;margin-top:14px}
.garden{position:relative;border-radius:22px;height:172px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;margin:10px 0;overflow:hidden}.garden .bgs{position:absolute;inset:0;width:100%;height:100%}.garden svg:not(.bgs){position:relative}
.tile span svg{width:42px;height:42px}nav span svg{width:24px;height:24px;margin:0 auto}.ic svg{width:28px;height:28px}.mic svg{width:42px;height:42px;color:#fff}.menu span svg{width:24px;height:24px;color:var(--pri2)}.item .ic{color:var(--pri2)}.item.imp .ic{color:#e5484d}.card,.item,.menu{box-shadow:0 1px 4px #4b3a8a14}svg.i{vertical-align:-5px}
input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:16px;padding:0 14px;font:inherit;background:var(--card);color:var(--ink);margin:6px 0}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.sep{text-align:center;color:var(--mut);margin:8px 0}
.hi{display:flex;gap:12px;align-items:center;margin-bottom:6px}.hi .grow{flex:1}
.prog{display:flex;justify-content:space-between;margin-top:10px;font-weight:600}
.bar{height:10px;background:var(--bar);border-radius:5px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:5px;transition:width .4s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{min-height:104px;border:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;background:var(--c);color:#2b2540}.tile span{font-size:32px}
.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tabs button{flex:none;padding:8px 16px;min-height:44px;border-radius:22px;border:0;background:var(--card);font-weight:600}.tabs .on{background:var(--pri);color:#fff}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}nav:empty{display:none}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:13px;color:var(--mut)}nav button span{display:block;font-size:22px;line-height:1.2}nav .on{color:var(--pri2);font-weight:700}
header{display:flex;align-items:center;justify-content:center;position:relative;min-height:46px;margin-bottom:8px}header h2{font-size:20px}.bk{position:absolute;left:0;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);font-size:28px;line-height:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.g3 div{aspect-ratio:1;background:var(--card);border-radius:18px;display:grid;place-items:center;font-size:40px}
.opts{display:flex;gap:10px}.opts button{flex:1;height:68px;font-size:36px;border:0;border-radius:18px;background:var(--card)}
.fb{min-height:28px;text-align:center;font-weight:700;margin-top:10px}
.pic{background:linear-gradient(#cfe9fb,#e8f6df);border-radius:22px;height:200px;display:grid;place-items:center;font-size:64px;margin:8px 0 14px;width:100%}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:var(--pink);font-size:36px;margin:10px auto;display:block}.mic.on{animation:pulse 1.2s infinite}
.wave{display:flex;align-items:center;gap:3px;height:48px;justify-content:center}.wave i{width:4px;height:14px;background:var(--pink);border-radius:2px}
.wave.on i{animation:w .8s ease-in-out infinite alternate}.wave i:nth-child(3n){animation-delay:.2s}.wave i:nth-child(3n+1){animation-delay:.4s}
@keyframes w{to{height:42px}}@keyframes pulse{50%{box-shadow:0 0 0 14px #f46f8040}}
.cvw{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:22px;margin:8px 0}.cvw svg,.cvw canvas{position:absolute;inset:0;width:100%;height:100%}canvas{touch-action:none}
.dots{display:flex;gap:8px;margin:10px 0}.dots i{width:12px;height:12px;border-radius:50%;background:#d8cdef}.dots .on{background:var(--pri)}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--card);border-radius:18px;margin:10px 0}.item .ic{font-size:26px}.item.imp{background:var(--imp)}
.menu{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border:0;border-radius:18px;background:var(--card);margin:8px 0;padding:0 14px;text-align:left}.menu b{flex:1;font-weight:600}.menu .ok{color:var(--ok);font-size:14px}
.m{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.m b{color:var(--ok)}
.note{background:var(--note);border-radius:18px;padding:14px;margin:12px 0}.disc{font-size:13px;color:var(--mut);margin-top:12px;text-align:center}
.score{font-size:40px;font-weight:800;color:var(--pri2)}
:focus-visible{outline:3px solid #3b2e8a;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

AF.memory=()=>{const F=['0','1','2','3'];let r=0,score=0,t1,t2;
  const rnd=n=>Math.random()*n|0;
  const round=()=>{r++;
    if(r>5){$('#view').innerHTML=`${back('เกมความจำ')}<div class="center"><h2>เสร็จแล้ว เก่งมากค่ะ!</h2><p class="big">${score}/5</p><button class="btn" data-go="home">กลับหน้าหลัก</button></div>`;return}
    $('#mc').textContent=r+'/5';$('#mp').style.width=(r-1)*20+'%';$('#mo').innerHTML='';$('#mf').textContent='';
    const cells=Array.from({length:9},()=>F[rnd(4)]),hid=rnd(9),ans=cells[hid];
    const draw=h=>$('#mg').innerHTML=cells.map((c,i)=>`<div>${h&&i===hid?'<b style="font-size:34px;color:var(--pri)">?</b>':FL2(c)}</div>`).join('');
    $('#mq').textContent='ดูภาพให้ดี แล้วจำตำแหน่งดอกไม้';draw(false);
    t1=setTimeout(()=>{draw(true);$('#mq').textContent='ดอกไม้ที่หายไปคือดอกไหน?';
      const o=[ans,...F.filter(f=>f!==ans).sort(()=>Math.random()-.5).slice(0,2)].sort(()=>Math.random()-.5);
      $('#mo').innerHTML=o.map(f=>`<button data-act="pick" data-f="${f}" aria-label="ดอกไม้ ${+f+1}">${FL2(f)}</button>`).join('');
      ACT.pick=b=>{if(!$('#mo').children.length)return;const ok=b.dataset.f===ans;score+=ok;$('#mo').innerHTML='';
        $('#mf').textContent=ok?'ถูกต้อง!':'ไม่เป็นไรค่ะ ลองใหม่ข้อต่อไป';t2=setTimeout(round,1000)}},3000)};
  round();return()=>{clearTimeout(t1);clearTimeout(t2)}};

AF.draw=()=>{const c=$('#cv'),x=c.getContext('2d');let d=false;x.lineWidth=7;x.lineCap=x.lineJoin='round';x.strokeStyle='#2a8f64';
  const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
  c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=()=>d=false;
  ACT.clear=()=>x.clearRect(0,0,c.width,c.height)};

let cur=null,hist=[],off=()=>{};
function go(id,push=true){
  if(id==='back'){id=hist.pop()||'home';push=false}
  const[k,p]=id.split(':');off();
  if(push&&cur&&cur!==id)hist.push(cur);cur=id;
  $('#view').innerHTML=em(SC[k](p));$('#view').scrollTop=0;
  $('#nav').innerHTML=MAIN.includes(k)?em(nav(k==='detail'?'report':k)):'';
  off=(AF[k]&&AF[k](p))||(()=>{});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act]');if(!b)return;
  if(b.dataset.go)go(b.dataset.go);else if(ACT[b.dataset.act])ACT[b.dataset.act](b)});
go('onboard');
</script>
